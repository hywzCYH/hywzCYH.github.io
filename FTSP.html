<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Boss 号筛选器 (! 战队)</title>
<style>
    :root {
        --bg: #ffffff;
        --bg-card: #ffffff;
        --text: #111111;
        --text-dim: #6b7280;
        --blue: #3b82f6;
        --border: #e5e7eb;
        --border-light: #f3f4f6;
    }
    * { box-sizing: border-box; }
    body {
        font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
        background: var(--bg);
        color: var(--text);
        margin: 0;
        padding: 0;
        -webkit-font-smoothing: antialiased;
    }
    .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
    h1 { font-size: 22px; margin: 0 0 6px 0; font-weight: 800; }
    .sub { font-size: 13px; color: var(--text-dim); margin: 0 0 20px 0; }
    .sub code {
        background: #fef3c7;
        color: #b45309;
        padding: 2px 8px;
        border-radius: 4px;
        font-weight: 700;
    }
    .card {
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 18px;
        margin-bottom: 14px;
    }
    .card h4 {
        font-size: 12px;
        font-weight: 700;
        color: var(--text-dim);
        margin: 0 0 12px 0;
        letter-spacing: 0.5px;
    }
    .row { display: flex; flex-wrap: wrap; gap: 10px; }
    .item { flex: 1; min-width: 100px; }
    .item label {
        display: block;
        font-size: 11px;
        font-weight: 600;
        color: var(--text-dim);
        margin-bottom: 5px;
    }
    input, select, textarea {
        width: 100%;
        padding: 8px 11px;
        border: 1px solid var(--border);
        border-radius: 7px;
        background: #fff;
        color: var(--text);
        font-size: 13px;
        font-family: inherit;
    }
    input:focus, textarea:focus, select:focus {
        outline: none;
        border-color: var(--blue);
        box-shadow: 0 0 0 3px rgba(59,130,246,0.1);
    }
    textarea {
        resize: vertical;
        height: 160px;
        font-family: "SF Mono", Monaco, Consolas, monospace;
        font-size: 12px;
        line-height: 1.5;
    }
    .actions { display: flex; gap: 10px; margin: 14px 0; }
    button {
        padding: 11px 22px;
        border: none;
        border-radius: 8px;
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
        color: white;
    }
    #runBtn {
        flex: 1;
        background: linear-gradient(135deg, #3b82f6, #2563eb);
        box-shadow: 0 2px 8px rgba(59,130,246,0.3);
    }
    #runBtn:disabled {
        background: var(--border);
        color: var(--text-dim);
        cursor: not-allowed;
        box-shadow: none;
    }
    #stopBtn { background: linear-gradient(135deg, #ef4444, #dc2626); }
    .btn-copy {
        padding: 5px 10px;
        font-size: 12px;
        background: var(--border-light);
        color: var(--text-dim);
        border-radius: 6px;
        font-weight: 600;
    }
    .btn-copy:hover { background: #e0f2fe; color: var(--blue); }
    .prog {
        font-size: 12px;
        color: var(--text-dim);
        margin: 12px 0;
        padding: 12px;
        background: var(--border-light);
        border-radius: 8px;
        font-family: "SF Mono", Monaco, Consolas, monospace;
        line-height: 1.6;
        word-break: break-all;
    }
    .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
        gap: 12px;
    }
    .result-card {
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 14px;
        position: relative;
    }
    .result-card::before {
        content: "";
        position: absolute;
        top: 0; left: 0; right: 0;
        height: 3px;
        border-radius: 12px 12px 0 0;
    }
    .result-card.qp::before { background: linear-gradient(90deg, #3b82f6, #60a5fa); }
    .result-card.qd::before { background: linear-gradient(90deg, #8b5cf6, #a78bfa); }
    .result-card.pp::before { background: linear-gradient(90deg, #10b981, #34d399); }
    .result-card.cqd::before { background: linear-gradient(90deg, #f59e0b, #fbbf24); }
    .result-card.e8h::before { background: linear-gradient(90deg, #ec4899, #f472b6); }
    .result-card.gl::before { background: linear-gradient(90deg, #06b6d4, #22d3ee); }
    .result-card.ar::before { background: linear-gradient(90deg, #ef4444, #f87171); }
    .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 10px;
    }
    .header span {
        font-size: 13px;
        font-weight: 700;
    }
    .header .badge {
        display: inline-block;
        font-size: 11px;
        padding: 2px 8px;
        border-radius: 10px;
        margin-left: 6px;
        font-weight: 600;
    }
    .qp .badge { background: #dbeafe; color: #1d4ed8; }
    .qd .badge { background: #ede9fe; color: #6d28d9; }
    .pp .badge { background: #d1fae5; color: #047857; }
    .cqd .badge { background: #fef3c7; color: #b45309; }
    .e8h .badge { background: #fce7f3; color: #9d174d; }
    .gl .badge { background: #cffafe; color: #155e75; }
    .ar .badge { background: #fee2e2; color: #991b1b; }
    .result-card textarea { height: 180px; }
</style>
</head>
<body>
<div class="container">
    <h1>⚔️ Boss 号筛选器</h1>
    <p class="sub">战队固定为 <code>!</code>（BossWeapon 特化增强）· 四评分池 + 三大排行榜</p>

    <div class="card">
        <h4>配置</h4>
        <div class="row">
            <div class="item"><label>前缀</label><input type="text" id="prefix" value="Fin"></div>
            <div class="item"><label>线程</label>
                <select id="threads">
                    <option value="4">4</option>
                    <option value="6">6</option>
                    <option value="8" selected>8</option>
                </select>
            </div>
            <div class="item"><label>块大小</label><input type="number" id="block" value="100000" step="10000" min="500"></div>
        </div>
    </div>

    <div class="card">
        <h4>号段</h4>
        <div class="row">
            <div class="item"><label>起始号</label><input type="number" id="start" value="0" step="0.1"></div>
            <div class="item"><label>结束号</label><input type="number" id="end" value="1" step="0.1"></div>
            <div class="item"><label>单位</label>
                <select id="unit">
                    <option value="100000">10w</option>
                    <option value="1000000">100w</option>
                    <option value="10000000">1000w</option>
                    <option value="100000000" selected>1E</option>
                </select>
            </div>
            <div class="item"><label>八围剪枝阈值</label><input type="number" id="th_e8" value="672" step="0.01"></div>
        </div>
    </div>

    <div class="card">
        <h4>阈值（留空 = 不启用该池）</h4>
        <div class="row">
            <div class="item"><label>SQP ≥</label><input type="number" id="th_sqp" value="5500"></div>
            <div class="item"><label>SQD ≥</label><input type="number" id="th_sqd" value="6000"></div>
            <div class="item"><label>SPP ≥</label><input type="number" id="th_spp"></div>
            <div class="item"><label>SCQD ≥</label><input type="number" id="th_scqd"></div>
        </div>
    </div>

    <div class="actions">
        <button id="runBtn" disabled>开始筛选</button>
        <button id="stopBtn" style="display:none" onclick="stopEval()">⏸ 暂停</button>
    </div>

    <div id="prog" class="prog">正在初始化...</div>

    <div class="grid">
        <div class="result-card qp">
            <div class="header">
                <span>SQP 池<span class="badge" id="badge-qp">≥5500</span></span>
                <button class="btn-copy" onclick="copyText('outQP')">📋</button>
            </div>
            <textarea id="outQP" readonly placeholder="SQP 达标的号（降序）..."></textarea>
        </div>
        <div class="result-card qd">
            <div class="header">
                <span>SQD 池<span class="badge" id="badge-qd">≥6000</span></span>
                <button class="btn-copy" onclick="copyText('outQD')">📋</button>
            </div>
            <textarea id="outQD" readonly placeholder="SQD 达标的号（降序）..."></textarea>
        </div>
        <div class="result-card pp">
            <div class="header">
                <span>SPP 池<span class="badge" id="badge-pp">未启用</span></span>
                <button class="btn-copy" onclick="copyText('outSPP')">📋</button>
            </div>
            <textarea id="outSPP" readonly placeholder="SPP 达标的号（降序）..."></textarea>
        </div>
        <div class="result-card cqd">
            <div class="header">
                <span>SCQD 池<span class="badge" id="badge-scqd">未启用</span></span>
                <button class="btn-copy" onclick="copyText('outSCQD')">📋</button>
            </div>
            <textarea id="outSCQD" readonly placeholder="SCQD 达标的号（降序）..."></textarea>
        </div>
        <div class="result-card e8h">
            <div class="header">
                <span>🏆 八围最高榜<span class="badge" id="badge-e8h">全程最高</span></span>
                <button class="btn-copy" onclick="copyText('outE8H')">📋</button>
            </div>
            <textarea id="outE8H" readonly placeholder="全程八围最高的号（并列全列）..."></textarea>
        </div>
        <div class="result-card gl">
            <div class="header">
                <span>✨ 华丽值最高榜<span class="badge" id="badge-gl">七围最低</span></span>
                <button class="btn-copy" onclick="copyText('outGL')">📋</button>
            </div>
            <textarea id="outGL" readonly placeholder="全程华丽值（七围最低项）最高的号（并列全列）..."></textarea>
        </div>
        <div class="result-card ar">
            <div class="header">
                <span>🌈 四项全能榜<span class="badge" id="badge-ar">四池全中</span></span>
                <button class="btn-copy" onclick="copyText('outAR')">📋</button>
            </div>
            <textarea id="outAR" readonly placeholder="SQP / SQD / SPP / SCQD 四项全部达标的号..."></textarea>
        </div>
    </div>
</div>

<script>
// ============ 常量 ============
const BOSS_TEAM = "!";
const MODEL_FILES = ["qp0", "qd0", "pp0", "cqd0", "cqd3"];

// ============ Wake Lock ============
let wakeLock = null;
async function keepAwake() {
    if (!('wakeLock' in navigator)) return;
    try { wakeLock = await navigator.wakeLock.request('screen'); } catch(e) {}
}
document.addEventListener('visibilitychange', function() {
    if (document.visibilityState === 'visible' && runState && runState.running) keepAwake();
});

// ============ 工具 ============
function copyText(id) {
    const el = document.getElementById(id);
    const text = el.value;
    if (!text) return alert("暂无内容");
    const temp = document.createElement("textarea");
    temp.value = text;
    temp.style.position = "absolute";
    temp.style.left = "-9999px";
    document.body.appendChild(temp);
    temp.select();
    temp.setSelectionRange(0, 999999);
    try { document.execCommand("copy"); alert("已复制"); } catch(e) { alert("复制失败"); }
    document.body.removeChild(temp);
}

// ============ 模型加载 ============
let modelData = null;

async function loadModels() {
    const prog = document.getElementById('prog');
    prog.innerText = "正在从云端加载模型 (8s超时)...";
    let ok = 0;
    try {
        const promises = MODEL_FILES.map(async (name) => {
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 8000);
            try {
                const res = await fetch("https://hywzcyh.github.io/NrD/" + name, { signal: controller.signal });
                if (!res.ok) throw new Error("HTTP " + res.status);
                const text = await res.text();
                let arr;
                if (text.startsWith('[')) {
                    try { arr = JSON.parse(text); } catch(e) { arr = new Function('return ' + text)(); }
                } else {
                    const m = text.match(/\[[\s\S]*\]/);
                    if (m) arr = new Function('return ' + m[0])();
                }
                if (!arr || !arr.length) throw new Error("数据解析失败");
                const f64 = new Float64Array(arr);
                ok++;
                prog.innerText = "加载模型... (" + ok + "/" + MODEL_FILES.length + ")";
                return { name, f64 };
            } finally {
                clearTimeout(timeoutId);
            }
        });
        const results = await Promise.all(promises);
        modelData = {};
        results.forEach(r => { modelData[r.name] = r.f64; });
        prog.innerText = "✅ 模型加载完成";
        document.getElementById('runBtn').disabled = false;
    } catch (e) {
        prog.innerText = "❌ 云端加载失败：" + e.message;
    }
}

// ============ 参数 ============
function readParams() {
    const unit = parseInt(document.getElementById('unit').value);
    const parseTh = (id) => {
        const v = document.getElementById(id).value.trim();
        if (v === '') return null;
        const n = parseFloat(v);
        return isNaN(n) ? null : n;
    };
    return {
        prefix: document.getElementById('prefix').value.trim(),
        start: Math.round(parseFloat(document.getElementById('start').value) * unit),
        end: Math.round(parseFloat(document.getElementById('end').value) * unit),
        th_e8: parseFloat(document.getElementById('th_e8').value) || 0,
        BLOCK: Math.max(500, parseInt(document.getElementById('block').value) || 100000),
        threads: parseInt(document.getElementById('threads').value),
        th_sqp: parseTh('th_sqp'),
        th_sqd: parseTh('th_sqd'),
        th_spp: parseTh('th_spp'),
        th_scqd: parseTh('th_scqd'),
    };
}

function paramsEqual(a, b) {
    return a.prefix === b.prefix
        && a.start === b.start && a.end === b.end
        && a.th_e8 === b.th_e8
        && a.BLOCK === b.BLOCK && a.threads === b.threads
        && a.th_sqp === b.th_sqp && a.th_sqd === b.th_sqd
        && a.th_spp === b.th_spp && a.th_scqd === b.th_scqd;
}

function updateBadges(p) {
    document.getElementById('badge-qp').innerText = p.th_sqp !== null ? '≥' + p.th_sqp : '未启用';
    document.getElementById('badge-qd').innerText = p.th_sqd !== null ? '≥' + p.th_sqd : '未启用';
    document.getElementById('badge-pp').innerText = p.th_spp !== null ? '≥' + p.th_spp : '未启用';
    document.getElementById('badge-scqd').innerText = p.th_scqd !== null ? '≥' + p.th_scqd : '未启用';
    // 四项全能只有四阈值都启用才可能
    const fourEnabled = p.th_sqp !== null && p.th_sqd !== null && p.th_spp !== null && p.th_scqd !== null;
    document.getElementById('badge-ar').innerText = fourEnabled ? '四池全中' : '需四项全启用';
}

['th_sqp', 'th_sqd', 'th_spp', 'th_scqd'].forEach(id => {
    document.getElementById(id).addEventListener('input', () => updateBadges(readParams()));
});

// ============ 暂停 ============
function stopEval() {
    if (!runState || !runState.running) return;
    runState.paused = true;
    runState.running = false;
    runState.accumulatedTime = (runState.accumulatedTime || 0) + (performance.now() - runState.runStartTime);

    let minInflight = runState.nextStart;
    for (let ws of runState.inFlight.values()) if (ws < minInflight) minInflight = ws;
    runState.nextStart = minInflight;
    runState.inFlight.clear();

    for (const w of runState.activeWorkers) { try { w.terminate(); } catch(e) {} }
    runState.activeWorkers = [];

    document.getElementById('runBtn').disabled = false;
    document.getElementById('runBtn').innerText = "▶ 继续 (从 " + runState.nextStart + ")";
    document.getElementById('stopBtn').style.display = "none";
    document.getElementById('prog').innerText = "⏸ 已暂停 | 已处理至 " + runState.nextStart + " / " + runState.end
        + " | 四池 QP:" + runState.qpList.length + " QD:" + runState.qdList.length
        + " SPP:" + runState.sppList.length + " SCQD:" + runState.scqdList.length
        + " | 八围最高:" + (runState.maxE8 === -Infinity ? "—" : runState.maxE8.toFixed(2))
        + " | 华丽最高:" + (runState.maxGlow === -Infinity ? "—" : runState.maxGlow);
}

// ============ 开始 ============
window.onload = function() {
    document.getElementById('runBtn').addEventListener('click', startEval);
    updateBadges(readParams());
    loadModels();
};

let runState = null;

function startEval() {
    if (!modelData) return alert("模型尚未加载完毕！");
    const params = readParams();
    if (params.start > params.end) return alert("起始值不能大于结束值！");

    const anyEnabled = params.th_sqp !== null || params.th_sqd !== null
        || params.th_spp !== null || params.th_scqd !== null;
    // 即使不启用任何阈值，也允许跑排行榜
    // if (!anyEnabled) return alert("至少启用一个评分阈值！");

    const isContinue = runState && runState.paused
        && paramsEqual(params, runState.params)
        && runState.nextStart <= runState.end;

    if (!isContinue) {
        runState = {
            params: params,
            paused: false, running: false,
            prefix: params.prefix,
            team: BOSS_TEAM,
            start: params.start, end: params.end,
            th_e8: params.th_e8, BLOCK: params.BLOCK, threads: params.threads,
            th_sqp: params.th_sqp, th_sqd: params.th_sqd,
            th_spp: params.th_spp, th_scqd: params.th_scqd,
            nextStart: params.start,
            totalProcessed: 0,
            totalCount: params.end - params.start + 1,
            // 四池
            qpList: [], qdList: [], sppList: [], scqdList: [],
            // 三大排行榜
            maxE8: -Infinity, e8List: [],
            maxGlow: -Infinity, glowList: [],
            allRoundList: [],
            accumulatedTime: 0,
            activeWorkers: [],
            stoppedCount: 0,
            modelsSentTo: null,
            inFlight: new Map(),
            lastRenderTime: 0,
            speedSampleTime: 0, speedSampleCount: 0, instantSpeed: 0,
        };
        ['outQP','outQD','outSPP','outSCQD','outE8H','outGL','outAR'].forEach(id => document.getElementById(id).value = "");
    }

    launchEval();
}

function launchEval() {
    const hc = navigator.hardwareConcurrency || 8;
    const threads = Math.min(runState.threads, hc);

    runState.running = true;
    runState.stoppedCount = 0;
    runState.activeWorkers = [];
    runState.modelsSentTo = new WeakSet();
    runState.inFlight = new Map();
    runState.runStartTime = performance.now();

    keepAwake();

    const btn = document.getElementById('runBtn');
    const stopBtn = document.getElementById('stopBtn');
    const prog = document.getElementById('prog');

    btn.disabled = true;
    stopBtn.style.display = "inline-block";
    prog.innerText = "运行中 (" + threads + " 线程, 块 " + runState.BLOCK + ", 战队 !)...";

    function totalElapsed() {
        return (runState.accumulatedTime || 0) + (performance.now() - runState.runStartTime);
    }

    function updateProgress() {
        const now = performance.now();
        if (now - runState.lastRenderTime > 100) {
            runState.lastRenderTime = now;
            if (now - runState.speedSampleTime > 500) {
                const dt = (now - runState.speedSampleTime) / 1000;
                if (dt > 0) runState.instantSpeed = (runState.totalProcessed - runState.speedSampleCount) / dt;
                runState.speedSampleTime = now;
                runState.speedSampleCount = runState.totalProcessed;
            }
            const shown = Math.min(runState.totalProcessed, runState.totalCount);
            const p = Math.min(100, (shown / runState.totalCount) * 100).toFixed(1);
            const elapsed = totalElapsed() / 1000;
            const avgSpeed = elapsed > 0 ? shown / elapsed : 0;
            const eta = runState.instantSpeed > 0.5 ? (runState.totalCount - shown) / runState.instantSpeed : 0;
            prog.innerText = "进度: " + p + "% (" + shown + " / " + runState.totalCount + ")"
                + " | QP:" + runState.qpList.length + " QD:" + runState.qdList.length
                + " SPP:" + runState.sppList.length + " SCQD:" + runState.scqdList.length
                + " | 八围最高:" + (runState.maxE8 === -Infinity ? "—" : runState.maxE8.toFixed(2))
                + " | 华丽最高:" + (runState.maxGlow === -Infinity ? "—" : runState.maxGlow)
                + " | 全能:" + runState.allRoundList.length
                + " | 实时 " + runState.instantSpeed.toFixed(0) + "/s"
                + " | 剩余 " + eta.toFixed(1) + "s";
        }
    }

    function finish() {
        runState.qpList.sort((a, b) => b.v - a.v);
        runState.qdList.sort((a, b) => b.v - a.v);
        runState.sppList.sort((a, b) => b.v - a.v);
        runState.scqdList.sort((a, b) => b.v - a.v);

        // 排行榜按号升序
        runState.e8List.sort((a, b) => a.n - b.n);
        runState.glowList.sort((a, b) => a.n - b.n);
        runState.allRoundList.sort((a, b) => a.n - b.n);

        document.getElementById('outQP').value = runState.qpList.map(x => x.s).join('\n');
        document.getElementById('outQD').value = runState.qdList.map(x => x.s).join('\n');
        document.getElementById('outSPP').value = runState.sppList.map(x => x.s).join('\n');
        document.getElementById('outSCQD').value = runState.scqdList.map(x => x.s).join('\n');
        document.getElementById('outE8H').value = runState.e8List.map(x => x.s).join('\n');
        document.getElementById('outGL').value = runState.glowList.map(x => x.s).join('\n');
        document.getElementById('outAR').value = runState.allRoundList.map(x => x.s).join('\n');

        const totalTime = totalElapsed() / 1000;
        const shown = Math.min(runState.totalProcessed, runState.totalCount);
        const avgSpeed = totalTime > 0 ? shown / totalTime : 0;

        btn.disabled = false;
        stopBtn.style.display = "none";
        prog.innerText = "✅ 完成 | 处理 " + shown + " / " + runState.totalCount + " 号"
            + " | QP:" + runState.qpList.length + " QD:" + runState.qdList.length
            + " SPP:" + runState.sppList.length + " SCQD:" + runState.scqdList.length

                    if (r.pd) runState.qdList.push({ v: r.qd, s: s_name + " | 八围:" + r.e8.toFixed(2) + " | SQD:" + r.qd });
                    if (r.ps) runState.sppList.push({ v: r.pp, s: s_name + " | 八围:" + r.e8.toFixed(2) + " | SPP:" + r.pp });

                if (idx >= 0) runState.activeWorkers.splice(idx, 1);

        const qdP = (scoreQD + 0.5) | 0;
        const ppP = (scorePP + 0.5) | 0;
        const cqdP = (scoreCQD + 0.5) | 0;

        const passQP = EN_QP && qpP >= TH_SQP;
        const passQD = EN_QD && qdP >= TH_SQD;
        const passPP = EN_PP && ppP >= TH_SPP;
        const passCQD = EN_CQD && cqdP >= TH_SCQD;

        if (passQP || passQD || passPP || passCQD) {
            validResults.push({
                n: n, e8: e8,
                qp: qpP, qd: qdP, pp: ppP, cqd: cqdP,
                pq: passQP ? 1 : 0, pd: passQD ? 1 : 0,
                ps: passPP ? 1 : 0, pc: passCQD ? 1 : 0
            });
        }

        // ★ 四项全能榜
        if (CAN_ALL_ROUND && passQP && passQD && passPP && passCQD) {
            allRoundList.push({
                n: n, e8: e8,
                s: prefix + " " + n + "@" + team
                    + " | SQP:" + qpP + " SQD:" + qdP
                    + " SPP:" + ppP + " SCQD:" + cqdP
                    + " | 八围:" + e8.toFixed(2)
            });
        }

        pending++;
        if ((++tick & 255) === 0 && performance.now() - lastPostTime > 200) {
            self.postMessage({ type: 'progress', count: pending });
            pending = 0; lastPostTime = performance.now();
        }
    }
    self.postMessage({
        type: 'done',
        results: validResults,
        count: pending,
        blockMaxE8: blockMaxE8,
        blockE8List: blockE8List,
        blockMaxGlow: blockMaxGlow,
        blockGlowList: blockGlowList,
        allRoundList: allRoundList
    });
};
`;

const workerUrl = URL.createObjectURL(new Blob([workerCode], { type: 'application/javascript' }));
</script>
