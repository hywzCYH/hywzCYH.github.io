<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>八围极速测算器</title>
<style>
    :root {
        --bg: #ffffff;
        --text: #111111;
        --blue: #3b82f6;
        --light-blue: #e0f2fe;
        --gray: #888888;
        --border: #e5e7eb;
    }
    body {
        font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
        background-color: var(--bg);
        color: var(--text);
        margin: 0;
        padding: 15px;
    }
    .container { max-width: 800px; margin: 0 auto; }
    h2 { font-size: 20px; text-align: center; color: var(--blue); margin-bottom: 20px; }
    .config-row { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 15px; }
    .form-item { flex: 1; min-width: 100px; }
    .form-item label { display: block; font-size: 12px; margin-bottom: 4px; color: var(--gray); }
    input[type="text"], input[type="number"], select, textarea {
        width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid var(--border); border-radius: 4px;
        background-color: var(--bg); color: var(--text); font-size: 14px;
    }
    textarea { resize: vertical; height: 250px; font-family: monospace; font-size: 13px; }
    input:focus, textarea:focus { outline: none; border-color: var(--blue); }
    .btn { padding: 12px; border: none; border-radius: 4px; font-size: 16px; font-weight: bold; cursor: pointer; background-color: var(--blue); color: white; width: 100%; margin-bottom: 15px; }
    .btn:disabled { background-color: #a3a3a3; cursor: not-allowed; }
    .btn-small { padding: 6px 12px; font-size: 12px; background-color: var(--light-blue); color: var(--blue); border: 1px solid var(--blue); border-radius: 4px; cursor: pointer; font-weight: bold; margin-left: 5px; }
    .progress-text { color: #999999; font-size: 14px; font-weight: bold; text-align: center; margin-bottom: 15px; }
    .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; margin-top: 15px; }
</style>
</head>
<body>

<div class="container">
    <h2>⚡ 八围极速测算器</h2>
    
    <div class="config-row">
        <div class="form-item"><label>前缀</label><input type="text" id="prefix" value="HYY"></div>
        <div class="form-item"><label>战队名</label><input type="text" id="team" value="HYWZ"></div>
        <div class="form-item">
            <label>线程数</label>
            <select id="threads">
                <option value="8">8线程</option>
                <option value="4">4线程</option>
                <option value="16">16线程</option>
            </select>
        </div>
    </div>
    
    <div class="config-row">
        <div class="form-item"><label>起始号</label><input type="number" id="start" value="0"></div>
        <div class="form-item"><label>结束号</label><input type="number" id="end" value="1000000"></div>
        <div class="form-item">
            <label>八围阈值 ≥</label>
            <input type="number" id="th_e8" value="672" step="0.01">
        </div>
    </div>

    <button class="btn" id="runBtn" onclick="start()">开始极速测算</button>
    
    <div class="progress-text" id="prog">等待启动...</div>

    <div class="header-bar">
        <span style="font-weight:bold; font-size:14px;">达标详细数据</span>
        <button class="btn-small" onclick="copyText('out_detail')">📋 复制</button>
    </div>
    <textarea id="out_detail" readonly placeholder="详细数据将在此输出..."></textarea>

    <div class="header-bar">
        <span style="font-weight:bold; font-size:14px;">达标纯名字 (自动去重)</span>
        <button class="btn-small" onclick="copyText('out_names')">📋 复制</button>
    </div>
    <textarea id="out_names" readonly placeholder="纯名字将在此输出..."></textarea>
</div>

<script>
function copyText(id) {
    let el = document.getElementById(id);
    if(!el.value) return alert("暂无内容");
    let temp = document.createElement("textarea");
    temp.value = el.value; temp.style.position = "absolute"; temp.style.left = "-9999px";
    document.body.appendChild(temp); temp.select(); temp.setSelectionRange(0, 999999);
    try { document.execCommand("copy"); alert("已复制！"); } catch(e) { alert("复制失败"); }
    document.body.removeChild(temp);
}

// ================= 核心极速 Worker =================
const workerCode = `
const S = new Uint8Array(256);
const base = new Uint8Array(128);
const arr = new Uint8Array(10);
const encoder = new TextEncoder();

self.onmessage = function(e) {
    let d = e.data;
    if (d.type === 'start') {
        let start = d.start, end = d.end;
        let prefix = d.prefix, team = d.team;
        let th_e8 = d.th_e8;

        let p_len = prefix.length;
        let nameBuf = new Uint8Array(256);
        nameBuf[0] = 0;
        for(let k=0; k<p_len; k++) nameBuf[k+1] = prefix.charCodeAt(k);

        let teamBuf = encoder.encode(team);
        let t_len = teamBuf.length + 1;
        let tk = new Uint8Array(256); tk[0] = 0;
        for(let k=0; k<teamBuf.length; k++) tk[k+1] = teamBuf[k];

        let S_team = new Uint8Array(256);
        for (let i = 0; i < 256; i++) S_team[i] = i;
        let jt = 0, kt = 0;
        for (let i = 0; i < 256; i++) {
            jt = (jt + S_team[i] + tk[kt]) & 0xFF;
            let tmp = S_team[i]; S_team[i] = S_team[jt]; S_team[jt] = tmp;
            kt++; if (kt >= t_len) kt = 0;
        }

        let validResults = [];
        let pending = 0;
        let lastPostTime = performance.now();
        let tick = 0;

        for(let n=start; n<=end; n++) {
            // 极速写入数字（免 toString）
            let temp = n, ptr = p_len + 20, slen = 0;
            if(n === 0) {
                nameBuf[p_len + 1] = 48; slen = 1;
            } else {
                while(temp > 0) {
                    ptr--; nameBuf[ptr] = 48 + (temp % 10); temp = (temp / 10) | 0; slen++;
                }
                for(let k=0; k<slen; k++) nameBuf[p_len + 1 + k] = nameBuf[ptr + k];
            }
            let nLen = p_len + 1 + slen;

            S.set(S_team);
            let j = 0, k_idx = 0;
            for(let i=0; i<256; i++) { j = (j + S[i] + nameBuf[k_idx]) & 0xFF; let tmp = S[i]; S[i] = S[j]; S[j] = tmp; k_idx++; if(k_idx >= nLen) k_idx = 0; }
            j = 0; k_idx = 0;
            for(let i=0; i<256; i++) { j = (j + S[i] + nameBuf[k_idx]) & 0xFF; let tmp = S[i]; S[i] = S[j]; S[j] = tmp; k_idx++; if(k_idx >= nLen) k_idx = 0; }

            // 八围只需 31 个 base，抽满就跳！
            let cnt = 0;
            for (let i = 0; i < 256 && cnt < 31; i++) {
                let m = (S[i] * 181 + 160) & 0xFF;
                if (m >= 89 && m < 217) base[cnt++] = m & 63;
            }

            // 极速插入排序找前 10
            for(let k=0; k<10; k++) arr[k] = base[k];
            for(let k=1; k<10; k++) {
                let v = arr[k]; let idx = k - 1;
                while(idx >= 0 && arr[idx] > v) { arr[idx+1] = arr[idx]; idx--; }
                arr[idx+1] = v;
            }
            let hp = 154 + arr[3] + arr[4] + arr[5] + arr[6];

            // 内联手写 Med3，极速运算
            let v1 = base[10], v2 = base[11], v3 = base[12], m3;
            if(v1 > v2) { m3=v1; v1=v2; v2=m3; } if(v2 > v3) { m3=v2; v2=v3; v3=m3; } if(v1 > v2) { m3=v1; v1=v2; v2=m3; }
            let atk = v2 + 36;

            v1 = base[13]; v2 = base[14]; v3 = base[15];
            if(v1 > v2) { m3=v1; v1=v2; v2=m3; } if(v2 > v3) { m3=v2; v2=v3; v3=m3; } if(v1 > v2) { m3=v1; v1=v2; v2=m3; }
            let def = v2 + 36;

            v1 = base[16]; v2 = base[17]; v3 = base[18];
            if(v1 > v2) { m3=v1; v1=v2; v2=m3; } if(v2 > v3) { m3=v2; v2=v3; v3=m3; } if(v1 > v2) { m3=v1; v1=v2; v2=m3; }
            let spd = v2 + 36;

            v1 = base[19]; v2 = base[20]; v3 = base[21];
            if(v1 > v2) { m3=v1; v1=v2; v2=m3; } if(v2 > v3) { m3=v2; v2=v3; v3=m3; } if(v1 > v2) { m3=v1; v1=v2; v2=m3; }
            let agi = v2 + 36;

            v1 = base[22]; v2 = base[23]; v3 = base[24];
            if(v1 > v2) { m3=v1; v1=v2; v2=m3; } if(v2 > v3) { m3=v2; v2=v3; v3=m3; } if(v1 > v2) { m3=v1; v1=v2; v2=m3; }
            let mag = v2 + 36;

            v1 = base[25]; v2 = base[26]; v3 = base[27];
            if(v1 > v2) { m3=v1; v1=v2; v2=m3; } if(v2 > v3) { m3=v2; v2=v3; v3=m3; } if(v1 > v2) { m3=v1; v1=v2; v2=m3; }
            let res = v2 + 36;

            v1 = base[28]; v2 = base[29]; v3 = base[30];
            if(v1 > v2) { m3=v1; v1=v2; v2=m3; } if(v2 > v3) { m3=v2; v2=v3; v3=m3; } if(v1 > v2) { m3=v1; v1=v2; v2=m3; }
            let intel = v2 + 36;

            let e8 = (hp * 0.3333333333333333) + atk + def + spd + agi + mag + res + intel;
            
            if (e8 >= th_e8) {
                validResults.push({ n: n, e8: e8, hp: hp, atk: atk, def: def, spd: spd, agi: agi, mag: mag, res: res, intel: intel });
            }

            pending++;
            if ((++tick & 2047) === 0 && performance.now() - lastPostTime > 200) {
                self.postMessage({type: 'progress', count: pending});
                pending = 0; lastPostTime = performance.now();
            }
        }
        self.postMessage({ type: 'done', results: validResults, count: pending });
    }
};
`;

const workerUrl = URL.createObjectURL(new Blob([workerCode], {type: 'application/javascript'}));
let activeWorkers = [];

function start() {
    for (let w of activeWorkers) w.terminate();
    activeWorkers = [];
    
    let prefix = document.getElementById('prefix').value.trim();
    let team = document.getElementById('team').value.trim();
    let startN = parseInt(document.getElementById('start').value) || 0;
    let endN = parseInt(document.getElementById('end').value) || 0;
    let th_e8 = parseFloat(document.getElementById('th_e8').value) || 0;
    
    if (startN >= endN) return alert("起始号必须小于结束号！");
    
    let threads = parseInt(document.getElementById('threads').value);
    let chunkSize = Math.ceil((endN - startN) / threads);
    
    let btn = document.getElementById('runBtn');
    let prog = document.getElementById('prog');
    let outDetail = document.getElementById('out_detail');
    let outNames = document.getElementById('out_names');
    
    btn.disabled = true;
    prog.innerText = "启动多线程，极速运算中...";
    outDetail.value = ""; outNames.value = "";
    
    let validNamesSet = new Set();
    let detailArr = []; 
    let totalProcessed = 0;
    let totalCount = endN - startN + 1;
    let finishedThreads = 0;
    let lastRenderTime = 0;
    let t0 = performance.now();
    
    function updateProgress() {
        let now = performance.now();
        if (now - lastRenderTime > 100) {
            lastRenderTime = now;
            let p = Math.min(100, (totalProcessed / totalCount) * 100).toFixed(1);
            let speed = Math.round(totalProcessed / ((now - t0) / 1000));
            prog.innerText = `进度: ${p}% (${totalProcessed}/${totalCount}) | 速度: ${speed} 号/秒`;
        }
    }

    function checkFinished() {
        if (finishedThreads === threads) {
            let el = ((performance.now() - t0) / 1000).toFixed(2);
            btn.disabled = false;
            prog.innerText = `✅ 测算完成！耗时 ${el}s，共筛出 ${validNamesSet.size} 个号。`;
            outDetail.value = detailArr.join('\n');
            outNames.value = Array.from(validNamesSet).join('\n');
        }
    }
    
    for (let t = 0; t < threads; t++) {
        let wStart = startN + t * chunkSize;
        let wEnd = Math.min(startN + (t + 1) * chunkSize - 1, endN);
        
        if (wStart > wEnd) { 
            finishedThreads++; 
            checkFinished();
            continue; 
        }
        
        let worker = new Worker(workerUrl);
        activeWorkers.push(worker);
        
        worker.onmessage = function(e) {
            if (e.data.type === 'progress') {
                totalProcessed += e.data.count;
                updateProgress();
            } else if (e.data.type === 'done') {
                totalProcessed += e.data.count;
                
                for(let r of e.data.results) {
                    let s_name = prefix + r.n + "@" + team;
                    validNamesSet.add(s_name);
                    detailArr.push(`${s_name} | 八围:${r.e8.toFixed(2)} | HP:${r.hp} 攻:${r.atk} 防:${r.def} 速:${r.spd} 敏:${r.agi} 魔:${r.mag} 抗:${r.res} 智:${r.intel}`);
                }
                
                finishedThreads++;
                worker.terminate();
                updateProgress();
                checkFinished();
            }
        };
        
        worker.postMessage({
            type: 'start', start: wStart, end: wEnd, prefix: prefix, team: team, th_e8: th_e8
        });
    }
}
</script>
</body>
</html>
