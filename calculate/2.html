<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>八围极速测算器</title>
<style>
    :root {
        --bg: #ffffff;
        --text: #111111;
        --blue: #3b82f6;
        --light-blue: #e0f2fe;
        --gray: #888888;
        --border: #e5e7eb;
        --purple: #8b5cf6;
        --red: #ef4444;
        --green: #16a34a;
    }
    body {
        font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
        background-color: var(--bg);
        color: var(--text);
        margin: 0;
        padding: 15px;
    }
    .container { max-width: 800px; margin: 0 auto; }
    h2 { font-size: 20px; text-align: center; color: var(--blue); margin-bottom: 20px; }
    .config-row { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 15px; }
    .form-item { flex: 1; min-width: 100px; }
    .form-item label { display: block; font-size: 12px; margin-bottom: 4px; color: var(--gray); }
    input[type="text"], input[type="number"], select, textarea {
        width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid var(--border); border-radius: 4px;
        background-color: var(--bg); color: var(--text); font-size: 14px;
    }
    textarea { resize: vertical; height: 250px; font-family: monospace; font-size: 13px; }
    input:focus, textarea:focus { outline: none; border-color: var(--blue); }
    .btn { padding: 12px; border: none; border-radius: 4px; font-size: 16px; font-weight: bold; cursor: pointer; background-color: var(--blue); color: white; width: 100%; margin-bottom: 15px; }
    .btn:disabled { background-color: #a3a3a3; cursor: not-allowed; }
    .btn-small { padding: 6px 12px; font-size: 12px; background-color: var(--light-blue); color: var(--blue); border: 1px solid var(--blue); border-radius: 4px; cursor: pointer; font-weight: bold; margin-left: 5px; }
    .progress-text { color: #999999; font-size: 14px; font-weight: bold; text-align: center; margin-bottom: 15px; }
    .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; margin-top: 15px; }

    /* ===== 结果展示区 ===== */
    .output-box {
        width: 100%;
        height: 260px;
        overflow-y: auto;
        border: 1px solid var(--border);
        border-radius: 4px;
        padding: 8px 10px;
        box-sizing: border-box;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 13px;
        line-height: 1.75;
        background: #fafafa;
        white-space: pre-wrap;
        word-break: break-all;
    }
    .output-box > div { border-bottom: 1px dashed #f0f0f0; padding: 1px 0; }
    .output-box > div:last-child { border-bottom: none; }

    .tag {
        display: inline-block;
        font-size: 11px;
        padding: 0 5px;
        margin-left: 5px;
        border-radius: 3px;
        font-weight: bold;
        border: 1px solid;
        line-height: 1.55;
        vertical-align: 1px;
        white-space: nowrap;
    }
    .tag-purple { color: var(--purple); border-color: var(--purple); background: #f5f3ff; }
    .tag-red    { color: var(--red);    border-color: var(--red);    background: #fef2f2; }
    .tag-green  { color: var(--green);  border-color: var(--green);  background: #f0fdf4; }

    .summary { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 6px; font-size: 12px; min-height: 4px; }
    .summary .tag { margin-left: 0; }
</style>
</head>
<body>

<div class="container">
    <h2>⚡ 八围极速测算器</h2>

    <div class="config-row">
        <div class="form-item"><label>前缀</label><input type="text" id="prefix" value="HYY"></div>
        <div class="form-item"><label>战队名</label><input type="text" id="team" value="HYWZ"></div>
        <div class="form-item">
            <label>线程数</label>
            <select id="threads">
                <option value="8">8线程</option>
                <option value="4">4线程</option>
                <option value="16">16线程</option>
            </select>
        </div>
    </div>

    <div class="config-row">
        <div class="form-item"><label>起始号</label><input type="number" id="start" value="0"></div>
        <div class="form-item"><label>结束号</label><input type="number" id="end" value="1000000"></div>
        <div class="form-item">
            <label>八围阈值 ≥</label>
            <input type="number" id="th_e8" value="672" step="0.01">
        </div>
    </div>

    <button class="btn" id="runBtn" onclick="start()">开始极速测算</button>

    <div class="progress-text" id="prog">等待启动...</div>

    <div class="header-bar">
        <span style="font-weight:bold; font-size:14px;">达标详细数据</span>
        <button class="btn-small" onclick="copyText('detail')">📋 复制</button>
    </div>
    <div class="summary" id="summary"></div>
    <div class="output-box" id="out_detail"><span style="color:#999">详细数据将在此输出...</span></div>

    <div class="header-bar">
        <span style="font-weight:bold; font-size:14px;">达标纯名字 (自动去重)</span>
        <button class="btn-small" onclick="copyText('names')">📋 复制</button>
    </div>
    <textarea id="out_names" readonly placeholder="纯名字将在此输出..."></textarea>
</div>

<script>
/* ================= 全局状态 ================= */
let activeWorkers = [];
let allResults = [];       // 所有达标结果
let lastDetailText = '';   // 纯文本缓存（用于复制）
let lastNamesText = '';

/* ================= 复制 ================= */
function copyText(which) {
    let text = (which === 'detail') ? lastDetailText : lastNamesText;
    if (!text) return alert("暂无内容");
    let temp = document.createElement("textarea");
    temp.value = text;
    temp.style.position = "absolute";
    temp.style.left = "-9999px";
    document.body.appendChild(temp);
    temp.select();
    temp.setSelectionRange(0, 999999);
    try { document.execCommand("copy"); alert("已复制！"); }
    catch (e) { alert("复制失败"); }
    document.body.removeChild(temp);
}

/* ================= 核心极速 Worker ================= */
const workerCode = `
const S = new Uint8Array(256);
const base = new Uint8Array(128);
const arr = new Uint8Array(10);
const encoder = new TextEncoder();

self.onmessage = function(e) {
    let d = e.data;
    if (d.type === 'start') {
        let start = d.start, end = d.end;
        let prefix = d.prefix, team = d.team;
        let th_e8 = d.th_e8;

        let p_len = prefix.length;
        let nameBuf = new Uint8Array(256);
        nameBuf[0] = 0;
        for(let k=0; k<p_len; k++) nameBuf[k+1] = prefix.charCodeAt(k);

        let teamBuf = encoder.encode(team);
        let t_len = teamBuf.length + 1;
        let tk = new Uint8Array(256); tk[0] = 0;
        for(let k=0; k<teamBuf.length; k++) tk[k+1] = teamBuf[k];

        let S_team = new Uint8Array(256);
        for (let i = 0; i < 256; i++) S_team[i] = i;
        let jt = 0, kt = 0;
        for (let i = 0; i < 256; i++) {
            jt = (jt + S_team[i] + tk[kt]) & 0xFF;
            let tmp = S_team[i]; S_team[i] = S_team[jt]; S_team[jt] = tmp;
            kt++; if (kt >= t_len) kt = 0;
        }

        let validResults = [];
        let pending = 0;
        let lastPostTime = performance.now();
        let tick = 0;

        for(let n=start; n<=end; n++) {
            // 极速写入数字（免 toString）
            let temp = n, ptr = p_len + 20, slen = 0;
            if(n === 0) {
                nameBuf[p_len + 1] = 48; slen = 1;
            } else {
                while(temp > 0) {
                    ptr--; nameBuf[ptr] = 48 + (temp % 10); temp = (temp / 10) | 0; slen++;
                }
                for(let k=0; k<slen; k++) nameBuf[p_len + 1 + k] = nameBuf[ptr + k];
            }
            let nLen = p_len + 1 + slen;

            S.set(S_team);
            let j = 0, k_idx = 0;
            for(let i=0; i<256; i++) { j = (j + S[i] + nameBuf[k_idx]) & 0xFF; let tmp = S[i]; S[i] = S[j]; S[j] = tmp; k_idx++; if(k_idx >= nLen) k_idx = 0; }
            j = 0; k_idx = 0;
            for(let i=0; i<256; i++) { j = (j + S[i] + nameBuf[k_idx]) & 0xFF; let tmp = S[i]; S[i] = S[j]; S[j] = tmp; k_idx++; if(k_idx >= nLen) k_idx = 0; }

            // 八围只需 31 个 base，抽满就跳！
            let cnt = 0;
            for (let i = 0; i < 256 && cnt < 31; i++) {
                let m = (S[i] * 181 + 160) & 0xFF;
                if (m >= 89 && m < 217) base[cnt++] = m & 63;
            }

            // 极速插入排序找前 10
            for(let k=0; k<10; k++) arr[k] = base[k];
            for(let k=1; k<10; k++) {
                let v = arr[k]; let idx = k - 1;
                while(idx >= 0 && arr[idx] > v) { arr[idx+1] = arr[idx]; idx--; }
                arr[idx+1] = v;
            }
            let hp = 154 + arr[3] + arr[4] + arr[5] + arr[6];

            // 内联手写 Med3，极速运算
            let v1 = base[10], v2 = base[11], v3 = base[12], m3;
            if(v1 > v2) { m3=v1; v1=v2; v2=m3; } if(v2 > v3) { m3=v2; v2=v3; v3=m3; } if(v1 > v2) { m3=v1; v1=v2; v2=m3; }
            let atk = v2 + 36;

            v1 = base[13]; v2 = base[14]; v3 = base[15];
            if(v1 > v2) { m3=v1; v1=v2; v2=m3; } if(v2 > v3) { m3=v2; v2=v3; v3=m3; } if(v1 > v2) { m3=v1; v1=v2; v2=m3; }
            let def = v2 + 36;

            v1 = base[16]; v2 = base[17]; v3 = base[18];
            if(v1 > v2) { m3=v1; v1=v2; v2=m3; } if(v2 > v3) { m3=v2; v2=v3; v3=m3; } if(v1 > v2) { m3=v1; v1=v2; v2=m3; }
            let spd = v2 + 36;

            v1 = base[19]; v2 = base[20]; v3 = base[21];
            if(v1 > v2) { m3=v1; v1=v2; v2=m3; } if(v2 > v3) { m3=v2; v2=v3; v3=m3; } if(v1 > v2) { m3=v1; v1=v2; v2=m3; }
            let agi = v2 + 36;

            v1 = base[22]; v2 = base[23]; v3 = base[24];
            if(v1 > v2) { m3=v1; v1=v2; v2=m3; } if(v2 > v3) { m3=v2; v2=v3; v3=m3; } if(v1 > v2) { m3=v1; v1=v2; v2=m3; }
            let mag = v2 + 36;

            v1 = base[25]; v2 = base[26]; v3 = base[27];
            if(v1 > v2) { m3=v1; v1=v2; v2=m3; } if(v2 > v3) { m3=v2; v2=v3; v3=m3; } if(v1 > v2) { m3=v1; v1=v2; v2=m3; }
            let res = v2 + 36;

            v1 = base[28]; v2 = base[29]; v3 = base[30];
            if(v1 > v2) { m3=v1; v1=v2; v2=m3; } if(v2 > v3) { m3=v2; v2=v3; v3=m3; } if(v1 > v2) { m3=v1; v1=v2; v2=m3; }
            let intel = v2 + 36;

            let e8 = (hp * 0.3333333333333333) + atk + def + spd + agi + mag + res + intel;

            if (e8 >= th_e8) {
                validResults.push({ n: n, e8: e8, hp: hp, atk: atk, def: def, spd: spd, agi: agi, mag: mag, res: res, intel: intel });
            }

            pending++;
            if ((++tick & 2047) === 0 && performance.now() - lastPostTime > 200) {
                self.postMessage({type: 'progress', count: pending});
                pending = 0; lastPostTime = performance.now();
            }
        }
        self.postMessage({ type: 'done', results: validResults, count: pending });
    }
};
`;

const workerUrl = URL.createObjectURL(new Blob([workerCode], {type: 'application/javascript'}));

/* ================= 开始测算 ================= */
function start() {
    for (let w of activeWorkers) w.terminate();
    activeWorkers = [];
    allResults = [];
    lastDetailText = '';
    lastNamesText = '';

    const prefix = document.getElementById('prefix').value.trim();
    const team   = document.getElementById('team').value.trim();
    const startN = parseInt(document.getElementById('start').value) || 0;
    const endN   = parseInt(document.getElementById('end').value) || 0;
    const th_e8  = parseFloat(document.getElementById('th_e8').value) || 0;

    if (startN >= endN) return alert("起始号必须小于结束号！");

    const threads   = parseInt(document.getElementById('threads').value);
    const chunkSize = Math.ceil((endN - startN + 1) / threads);

    const btn        = document.getElementById('runBtn');
    const prog       = document.getElementById('prog');
    const outDetail  = document.getElementById('out_detail');
    const outNames   = document.getElementById('out_names');
    const summaryEl  = document.getElementById('summary');

    btn.disabled = true;
    prog.innerText = "启动多线程，极速运算中...";
    outDetail.innerHTML = '<span style="color:#999">运算中...</span>';
    outNames.value = "";
    summaryEl.innerHTML = "";

    const validNamesSet   = new Set();
    const totalCount      = endN - startN + 1;
    let totalProcessed    = 0;
    let finishedThreads   = 0;
    let lastRenderTime    = 0;
    const t0 = performance.now();

    function updateProgress() {
        const now = performance.now();
        if (now - lastRenderTime > 100) {
            lastRenderTime = now;
            const p = Math.min(100, (totalProcessed / totalCount) * 100).toFixed(1);
            const speed = Math.round(totalProcessed / ((now - t0) / 1000));
            prog.innerText = `进度: ${p}% (${totalProcessed}/${totalCount}) | 速度: ${speed} 号/秒`;
        }
    }

    function checkFinished() {
        if (finishedThreads === threads) {
            const el = ((performance.now() - t0) / 1000).toFixed(2);
            renderResults();
            btn.disabled = false;
            prog.innerText = `✅ 测算完成！耗时 ${el}s，共筛出 ${allResults.length} 个号。`;
        }
    }

    for (let t = 0; t < threads; t++) {
        const wStart = startN + t * chunkSize;
        const wEnd   = Math.min(startN + (t + 1) * chunkSize - 1, endN);

        if (wStart > wEnd) {
            finishedThreads++;
            checkFinished();
            continue;
        }

        const worker = new Worker(workerUrl);
        activeWorkers.push(worker);

        worker.onmessage = function (e) {
            if (e.data.type === 'progress') {
                totalProcessed += e.data.count;
                updateProgress();
            } else if (e.data.type === 'done') {
                totalProcessed += e.data.count;

                for (const r of e.data.results) {
                    // 华丽值 = 除 HP 外七项最小值
                    r.glam = Math.min(r.atk, r.def, r.spd, r.agi, r.mag, r.res, r.intel);
                    r.name = prefix + r.n + "@" + team;
                    allResults.push(r);
                    validNamesSet.add(r.name);
                }

                finishedThreads++;
                worker.terminate();
                updateProgress();
                checkFinished();
            }
        };

        worker.postMessage({
            type: 'start', start: wStart, end: wEnd,
            prefix: prefix, team: team, th_e8: th_e8
        });
    }
}

/* ================= 结果渲染（高亮标记） ================= */
function renderResults() {
    const elDetail  = document.getElementById('out_detail');
    const elNames   = document.getElementById('out_names');
    const elSummary = document.getElementById('summary');

    if (allResults.length === 0) {
        elDetail.innerHTML = '<span style="color:#999">没有达标的号码</span>';
        elNames.value = '';
        elSummary.innerHTML = '';
        lastDetailText = '';
        lastNamesText = '';
        return;
    }

    // 按号码升序排列，方便查看
    allResults.sort((a, b) => a.n - b.n);

    // 计算全局最高值
    let maxE8 = -Infinity;
    let maxGlam = -Infinity;
    for (const r of allResults) {
        if (r.e8 > maxE8) maxE8 = r.e8;
        if (r.glam > maxGlam) maxGlam = r.glam;
    }
    const EPS = 1e-6;

    let topE8Count = 0, topGlamCount = 0, over740Count = 0;

    const htmlParts = [];
    const textParts = [];
    const nameParts = [];

    for (const r of allResults) {
        const isTopE8   = Math.abs(r.e8 - maxE8) < EPS;   // 八围最高（并列都算）
        const isOver740 = r.e8 >= 740 - EPS;              // 八围 740 及以上
        const isTopGlam = r.glam === maxGlam;             // 华丽值最高（并列都算）

        if (isTopE8)   topE8Count++;
        if (isOver740) over740Count++;
        if (isTopGlam) topGlamCount++;

        /* --- 颜色优先级：八围最高(紫) > 740+(红) > 华丽最高(绿) --- */
        let nameStyle = '';
        if (isTopE8)        nameStyle = 'color:#8b5cf6;font-weight:bold;';
        else if (isOver740) nameStyle = 'color:#ef4444;font-weight:bold;';
        else if (isTopGlam) nameStyle = 'color:#16a34a;font-weight:bold;';

        /* --- 角标：把所有荣誉都标出来，避免互相覆盖 --- */
        let tags = '';
        if (isTopE8)   tags += '<span class="tag tag-purple">👑 八围最高</span>';
        if (isTopGlam) tags += '<span class="tag tag-green">💎 华丽最高</span>';
        if (isOver740 && !isTopE8) tags += '<span class="tag tag-red">🔥 740+</span>';

        htmlParts.push(
            '<div>' +
                '<span style="' + nameStyle + '">' + r.name + '</span>' + tags +
                ' <span style="color:#cbd5e1">│</span> ' +
                '八围:<b>' + r.e8.toFixed(2) + '</b> ' +
                '华丽:<b>' + r.glam + '</b> ' +
                '<span style="color:#cbd5e1">│</span> ' +
                'HP:' + r.hp + ' 攻:' + r.atk + ' 防:' + r.def +
                ' 速:' + r.spd + ' 敏:' + r.agi + ' 魔:' + r.mag +
                ' 抗:' + r.res + ' 智:' + r.intel +
            '</div>'
        );

        textParts.push(
            r.name +
            ' | 八围:' + r.e8.toFixed(2) +
            ' | 华丽:' + r.glam +
            ' | HP:' + r.hp + ' 攻:' + r.atk + ' 防:' + r.def +
            ' 速:' + r.spd + ' 敏:' + r.agi + ' 魔:' + r.mag +
            ' 抗:' + r.res + ' 智:' + r.intel +
            (isTopE8 ? ' [八围最高]' : '') +
            (isOver740 ? ' [740+]' : '') +
            (isTopGlam ? ' [华丽最高]' : '')
        );

        nameParts.push(r.name);
    }

    elDetail.innerHTML  = htmlParts.join('');
    elNames.value       = nameParts.join('\n');
    lastDetailText      = textParts.join('\n');
    lastNamesText       = nameParts.join('\n');

    /* --- 顶部汇总条 --- */
    elSummary.innerHTML =
        '<span class="tag tag-purple">👑 八围最高 ' + maxE8.toFixed(2) + ' · ' + topE8Count + ' 个</span>' +
        '<span class="tag tag-green">💎 华丽最高 ' + maxGlam + ' · ' + topGlamCount + ' 个</span>' +
        '<span class="tag tag-red">🔥 八围 ≥740 · ' + over740Count + ' 个</span>';
}
</script>
</body>
</html>
