<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Namerena 多核极速筛选（四池版）</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, "Segoe UI", "Microsoft YaHei", monospace; background: #0f172a; color: #e2e8f0; margin: 0; padding: 16px; }
  .card { background: #1e293b; padding: 20px; border-radius: 12px; margin: 12px auto; max-width: 1200px; border: 1px solid #334155; }
  h2 { margin: 0 0 14px; font-size: 17px; color: #38bdf8; }
  h3 { margin: 0 0 8px; font-size: 14px; color: #cbd5e1; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .item { flex: 1; min-width: 90px; }
  .item label { display: block; font-size: 11px; color: #94a3b8; margin-bottom: 3px; }
  input, select, textarea { width: 100%; padding: 6px 8px; box-sizing: border-box; border: 1px solid #334155; border-radius: 5px; background: #0f172a; color: #e2e8f0; font-size: 13px; font-family: inherit; }
  textarea { resize: vertical; height: 240px; font-family: monospace; font-size: 12px; }
  input:focus, textarea:focus { outline: none; border-color: #38bdf8; }
  button { padding: 9px 16px; font-size: 13px; font-weight: bold; cursor: pointer; border: none; border-radius: 6px; background: #3b82f6; color: white; margin: 3px; }
  button:hover { background: #2563eb; }
  button.small { padding: 5px 10px; font-size: 12px; background: #334155; }
  button.danger { background: #ef4444; }
  button.danger:hover { background: #dc2626; }
  button:disabled { background: #475569; cursor: not-allowed; }
  .bar { width: 100%; height: 8px; background: #334155; border-radius: 4px; overflow: hidden; margin: 10px 0; }
  .bar-fill { height: 100%; background: linear-gradient(90deg, #3b82f6, #38bdf8); transition: width 0.15s; width: 0%; }
  .stat { font-size: 12px; color: #94a3b8; margin: 6px 0; font-family: monospace; }
  .stat b { color: #38bdf8; }
  .cols { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
  .col { flex: 1; min-width: 300px; }
  .ok { color: #22c55e; }
  .bad { color: #ef4444; }
  .th { color: #fbbf24; }
</style>
</head>
<body>

<div class="card">
  <h2>⚡ Namerena 多核极速筛选（四池版）</h2>
  <div class="row">
    <div class="item"><label>前缀</label><input id="prefix" value="Fin "></div>
    <div class="item"><label>战队</label><input id="team" value="HYWZ"></div>
    <div class="item"><label>起始号</label><input id="start" type="number" value="0" step="0.1"></div>
    <div class="item"><label>结束号</label><input id="end" type="number" value="1" step="0.1"></div>
    <div class="item"><label>单位</label>
      <select id="unit">
        <option value="100000">10w</option>
        <option value="1000000">100w</option>
        <option value="10000000">1000w</option>
        <option value="100000000">1E</option>
      </select>
    </div>
  </div>
  <div class="row">
    <div class="item"><label>八围 ≥</label><input id="th_e8" type="number" value="672" step="0.01"></div>
    <div class="item"><label class="th">SQP ≥</label><input id="th_sqp" type="number" value="5500"></div>
    <div class="item"><label class="th">SQD ≥</label><input id="th_sqd" type="number" value="6000"></div>
    <div class="item"><label class="th">SPP ≥</label><input id="th_spp" type="number" value="7500"></div>
    <div class="item"><label class="th">SCQD ≥</label><input id="th_scqd" type="number" value="4000"></div>
  </div>
  <div class="row">
    <div class="item"><label>线程数</label><input id="threads" type="number" value="8" min="1" max="64"></div>
    <div class="item"><label>块大小</label><input id="block" type="number" value="20000" step="1000" min="500"></div>
  </div>
  <div>
    <span class="stat">逻辑核: <b id="cores">?</b></span>
    <span class="stat">模型: <b id="modelState">加载中...</b></span>
  </div>
  <div class="bar"><div class="bar-fill" id="bar"></div></div>
  <div id="status" class="stat">就绪</div>
  <div style="margin-top:6px;">
    <button id="runBtn" disabled>开始筛选</button>
    <button id="stopBtn" class="danger" style="display:none">⏸ 停止</button>
  </div>
</div>

<div class="card">
  <div class="cols">
    <div class="col">
      <h3>SQP 达标（降序）<button class="small" onclick="copyText('outQP')" style="float:right">📋</button></h3>
      <textarea id="outQP" readonly placeholder="SQP 池..."></textarea>
    </div>
    <div class="col">
      <h3>SQD 达标（降序）<button class="small" onclick="copyText('outQD')" style="float:right">📋</button></h3>
      <textarea id="outQD" readonly placeholder="SQD 池..."></textarea>
    </div>
  </div>
  <div class="cols">
    <div class="col">
      <h3>SPP 达标（降序）<button class="small" onclick="copyText('outSPP')" style="float:right">📋</button></h3>
      <textarea id="outSPP" readonly placeholder="SPP 池..."></textarea>
    </div>
    <div class="col">
      <h3>SCQD 达标（降序）<button class="small" onclick="copyText('outSCQD')" style="float:right">📋</button></h3>
      <textarea id="outSCQD" readonly placeholder="SCQD 池..."></textarea>
    </div>
  </div>
</div>

<script>
'use strict';

const $ = id => document.getElementById(id);
$('cores').textContent = navigator.hardwareConcurrency || '?';

// ============================================================
// Worker：完整名字哈希 + 八围 + 技能 + 四模型评分
// ============================================================
const WORKER_CODE = `
'use strict';
const N = 256, K = 64, skill_cnt = 40;
const encoder = new TextEncoder();

const S      = new Uint8Array(256);
const S2     = new Uint8Array(256);
const base   = new Uint8Array(128);
const base2  = new Uint8Array(128);
const skl_id = new Uint8Array(40);
const freq   = new Uint8Array(40);
const arr    = new Uint8Array(10);
const arr2   = new Uint8Array(10);
const x      = new Float64Array(46);
const active = new Uint8Array(46);
const nameBuf    = new Uint8Array(256);
const shadowBuf  = new Uint8Array(256);

let modelAOS = null;   // [qp0, qd0, pp0, cqd0] 交错，stride 4
let modelCQD3 = null;
let S_team = new Uint8Array(256);
let p_len = 0;

const pairIdx = new Int32Array(46 * 46).fill(-1);
let pp = 47;
for (let i = 0; i < 46; i++) {
  for (let j = i; j < 46; j++) {
    if ((i === 26 && (j === 37 || j === 45)) ||
        (i === 42 && j === 44) || (i === 44 && j === 44)) continue;
    pairIdx[i * 46 + j] = pp++;
  }
}

const mod40 = new Uint8Array(65536);
for (let i = 0; i < 65536; i++) mod40[i] = i % 40;

const skl_init = new Uint8Array(40);
for (let i = 0; i < 40; i++) skl_init[i] = i;

function med3(a, b, c) {
  let t;
  if (a > b) { t = a; a = b; b = t; }
  if (b > c) { t = b; b = c; c = t; }
  if (a > b) { t = a; a = b; b = t; }
  return b;
}

function initTeam(team) {
  const tb = encoder.encode(team);
  const t_len = tb.length + 1;
  const tk = new Uint8Array(256);
  tk[0] = 0;
  for (let i = 0; i < tb.length; i++) tk[i + 1] = tb[i];
  const ST = new Uint8Array(256);
  for (let i = 0; i < 256; i++) ST[i] = i;
  let jt = 0, kt = 0;
  for (let i = 0; i < 256; i++) {
    jt = (jt + ST[i] + tk[kt]) & 0xFF;
    const t = ST[i]; ST[i] = ST[jt]; ST[jt] = t;
    kt++; if (kt >= t_len) kt = 0;
  }
  S_team = ST;
}

function initPrefix(prefix) {
  const pb = encoder.encode(prefix);
  p_len = pb.length;
  nameBuf[0] = 0;
  for (let k = 0; k < p_len; k++) nameBuf[k + 1] = pb[k];
}

self.onmessage = function(e) {
  const d = e.data;

  if (d.type === 'init') {
    // 组装 AOS：[qp0, qd0, pp0, cqd0] 交错
    const qp0 = d.qp0, qd0 = d.qd0, pp0 = d.pp0, cqd0 = d.cqd0;
    modelAOS = new Float64Array(1124 * 4);
    for (let i = 0; i < 1124; i++) {
      modelAOS[i*4]   = qp0[i];
      modelAOS[i*4+1] = qd0[i];
      modelAOS[i*4+2] = pp0[i];
      modelAOS[i*4+3] = cqd0[i];
    }
    modelCQD3 = d.cqd3;
    self.postMessage({ type: 'inited' });
    return;
  }

  if (d.type === 'initContext') {
    initTeam(d.team);
    initPrefix(d.prefix);
    self.postMessage({ type: 'ctxReady' });
    return;
  }

  if (d.type === 'stop') {
    self.postMessage({ type: 'stopped' });
    return;
  }

  if (d.type !== 'work') return;

  const { start, end, th_e8, th_sqp, th_sqd, th_spp, th_scqd } = d;
  const results = [];
  let processed = 0;

  for (let n = start; n <= end; n++) {
    const ns = n.toString();
    const nsLen = ns.length;
    for (let k = 0; k < nsLen; k++) nameBuf[p_len + k + 2] = ns.charCodeAt(k);
    const nLen = p_len + nsLen + 2;

    // 1. 名字哈希
    S.set(S_team);
    let j = 0, kIdx = 0;
    for (let i = 0; i < 256; i++) {
      j = (j + S[i] + nameBuf[kIdx]) & 0xFF;
      const t = S[i]; S[i] = S[j]; S[j] = t;
      kIdx++; if (kIdx >= nLen) kIdx = 0;
    }
    j = 0; kIdx = 0;
    for (let i = 0; i < 256; i++) {
      j = (j + S[i] + nameBuf[kIdx]) & 0xFF;
      const t = S[i]; S[i] = S[j]; S[j] = t;
      kIdx++; if (kIdx >= nLen) kIdx = 0;
    }

    // 2. 前 31 base -> 八围
    let cnt = 0, i = 0;
    for (; i < 256 && cnt < 31; i++) {
      const m = (S[i] * 181 + 160) & 0xFF;
      if (m >= 89 && m < 217) base[cnt++] = m & 63;
    }

    for (let k = 0; k < 10; k++) arr[k] = base[k];
    for (let k = 1; k < 10; k++) {
      const v = arr[k]; let jj = k - 1;
      while (jj >= 0 && arr[jj] > v) { arr[jj+1] = arr[jj]; jj--; }
      arr[jj+1] = v;
    }
    const hp    = 154 + arr[3] + arr[4] + arr[5] + arr[6];
    const atk   = med3(base[10], base[11], base[12]) + 36;
    const def   = med3(base[13], base[14], base[15]) + 36;
    const spd   = med3(base[16], base[17], base[18]) + 36;
    const agi   = med3(base[19], base[20], base[21]) + 36;
    const mag   = med3(base[22], base[23], base[24]) + 36;
    const res   = med3(base[25], base[26], base[27]) + 36;
    const intel = med3(base[28], base[29], base[30]) + 36;

    const e8 = hp * 0.3333333333333333 + atk + def + spd + agi + mag + res + intel;
    processed++;

    if (e8 < th_e8) continue;

    // 3. 补齐到 128
    for (; i < 256 && cnt < 128; i++) {
      const m = (S[i] * 181 + 160) & 0xFF;
      if (m >= 89 && m < 217) base[cnt++] = m & 63;
    }
    if (cnt < 128) base.fill(0, cnt, 128);

    // 4. 技能洗牌
    skl_id.set(skl_init);
    freq.fill(0, 0, 16);
    let a = 0, b = 0, s = 0;
    for (let r = 0; r < 2; r++) {
      for (let k = 0; k < 40; k++) {
        a += 1; b = (b + S[a]) & 0xFF;
        let t1 = S[a]; S[a] = S[b]; S[b] = t1;
        const u = S[(S[a] + S[b]) & 0xFF];
        a += 1; b = (b + S[a]) & 0xFF;
        let t2 = S[a]; S[a] = S[b]; S[b] = t2;
        const tv = S[(S[a] + S[b]) & 0xFF];
        const rnd = mod40[(u << 8) | tv];
        s += rnd + skl_id[k];
        if (s >= 40) { s -= 40; if (s >= 40) s -= 40; }
        const tmp = skl_id[k]; skl_id[k] = skl_id[s]; skl_id[s] = tmp;
      }
    }

    // 5. 技能频率
    let last = -1;
    for (let jj = 0; jj < 16; jj++) {
      const id = 64 + jj * 4;
      let p = base[id];
      if (base[id+1] < p) p = base[id+1];
      if (base[id+2] < p) p = base[id+2];
      if (base[id+3] < p) p = base[id+3];
      if (p > 10 && skl_id[jj] < 35) {
        freq[jj] = p - 10;
        if (skl_id[jj] < 25) last = jj;
      }
    }

    if (last === -1) {
      if (freq[14] > 0) { const m = base[60] < base[61] ? base[60] : base[61]; freq[14] += (freq[14] < m ? freq[14] : m); }
      if (freq[15] > 0) { const m = base[62] < base[63] ? base[62] : base[63]; freq[15] += (freq[15] < m ? freq[15] : m); }
    } else if (last === 14) {
      freq[14] <<= 1;
      if (freq[15] > 0) { const m = base[62] < base[63] ? base[62] : base[63]; freq[15] += (freq[15] < m ? freq[15] : m); }
    } else if (last === 15) {
      freq[15] <<= 1;
      if (freq[14] > 0) { const m = base[60] < base[61] ? base[60] : base[61]; freq[14] += (freq[14] < m ? freq[14] : m); }
    } else {
      freq[last] <<= 1;
      if (freq[14] > 0) { const m = base[60] < base[61] ? base[60] : base[61]; freq[14] += (freq[14] < m ? freq[14] : m); }
      if (freq[15] > 0) { const m = base[62] < base[63] ? base[62] : base[63]; freq[15] += (freq[15] < m ? freq[15] : m); }
    }

    // 6. 构建 x 向量
    x[0] = hp; x[1] = atk; x[2] = def; x[3] = spd;
    x[4] = agi; x[5] = mag; x[6] = res; x[7] = intel;
    for (let k = 8; k < 46; k++) x[k] = 0;

    let zd = 1, kill = 1;
    for (let k = 0; k < 16; k++) {
      const skId = skl_id[k], f = freq[k];
      if (skId >= 35 || f === 0) continue;
      if (skId === 9 || skId === 16) { x[skId+8] = zd * f; zd *= (1 - f * 0.00234375); }
      else if (skId === 18) { x[skId+8] = zd * f; zd *= (1 - f * 0.002734375); }
      else if (skId === 19 || skId === 23) { x[skId+8] = zd * f; zd *= (1 - f * 0.0046875); }
      else if (skId === 20 || skId === 22) { x[skId+8] = zd * f; zd *= (1 - f * 0.00546875); }
      else if (skId < 25) { x[skId+8] = zd * f; zd *= (1 - f * 0.0078125); }
      else if (skId === 31 || skId === 32) { x[skId+8] = kill * f; kill *= (1 - f * 0.0078125); }
      else { x[skId+8] = f; }
    }

    // 护盾非线性
    if (x[37] <= 70) x[37] = x[37] * x[37] / 70;
    else x[37] = x[37] * 2 - 70;

    // 7. shadow
    if (x[32] > 0) {
      base2.fill(0);
      for (let k = 0; k < nLen; k++) shadowBuf[k] = nameBuf[k];
      const suffix = '?shadow';
      for (let k = 0; k < suffix.length; k++) shadowBuf[nLen + k] = suffix.charCodeAt(k);
      const sLen = nLen + suffix.length;

      S2.set(S_team);
      let j2 = 0, k2 = 0;
      for (let i = 0; i < 256; i++) {
        j2 = (j2 + S2[i] + shadowBuf[k2]) & 0xFF;
        const t = S2[i]; S2[i] = S2[j2]; S2[j2] = t;
        k2++; if (k2 >= sLen) k2 = 0;
      }
      j2 = 0; k2 = 0;
      for (let i = 0; i < 256; i++) {
        j2 = (j2 + S2[i] + shadowBuf[k2]) & 0xFF;
        const t = S2[i]; S2[i] = S2[j2]; S2[j2] = t;
        k2++; if (k2 >= sLen) k2 = 0;
      }

      let cnt2 = 0;
      for (let i = 0; i < 256 && cnt2 < 31; i++) {
        const m = (S2[i] * 181 + 160) & 0xFF;
        if (m >= 89 && m < 217) base2[cnt2++] = m & 63;
      }
      if (cnt2 < 31) base2.fill(0, cnt2, 31);

      for (let k = 0; k < 10; k++) arr2[k] = base2[k];
      for (let k = 1; k < 10; k++) {
        const v = arr2[k]; let jj = k - 1;
        while (jj >= 0 && arr2[jj] > v) { arr2[jj+1] = arr2[jj]; jj--; }
        arr2[jj+1] = v;
      }
      const hp2    = 154 + arr2[3] + arr2[4] + arr2[5] + arr2[6];
      const atk2   = med3(base2[10], base2[11], base2[12]);
      const def2   = med3(base2[13], base2[14], base2[15]);
      const spd2   = med3(base2[16], base2[17], base2[18]);
      const agi2   = med3(base2[19], base2[20], base2[21]);
      const mag2   = med3(base2[22], base2[23], base2[24]);
      const res2   = med3(base2[25], base2[26], base2[27]);
      const intel2 = med3(base2[28], base2[29], base2[30]);
      const shadowi = atk2*2.8 + def2*0.6 + spd2*2.5 + agi2*1.2 + mag2 + res2 - 1.2*intel2 + 0.8*hp2;
      x[43] = shadowi * x[32] / 100;
    } else {
      x[43] = 0;
    }

    if (x[42] > 0) x[44] = 1;
    if (x[37] > 0) { x[45] = x[26]; x[26] = 0; }

    // 8. AOS 稀疏点积（4 模型）
    let scoreQP = modelAOS[0], scoreQD = modelAOS[1], scorePP = modelAOS[2], scoreCQD2 = modelAOS[3];
    let activeLen = 0;
    for (let k = 0; k < 46; k++) if (x[k] !== 0) active[activeLen++] = k;

    for (let ai = 0; ai < activeLen; ai++) {
      const k = active[ai], v = x[k], mi = (1 + k) * 4;
      scoreQP += modelAOS[mi] * v;
      scoreQD += modelAOS[mi+1] * v;
      scorePP += modelAOS[mi+2] * v;
      scoreCQD2 += modelAOS[mi+3] * v;
    }
    for (let ai = 0; ai < activeLen; ai++) {
      const k = active[ai], xk = x[k];
      for (let bi = ai; bi < activeLen; bi++) {
        const l = active[bi];
        const mi = pairIdx[k * 46 + l];
        if (mi < 0) continue;
        const v = xk * x[l];
        const off = mi * 4;
        scoreQP += modelAOS[off] * v;
        scoreQD += modelAOS[off+1] * v;
        scorePP += modelAOS[off+2] * v;
        scoreCQD2 += modelAOS[off+3] * v;
      }
    }

    // 9. SCQD：幻术号 >= 30 时走 cqd3，取 max(cqd1, cqd2)*100
    let scoreCQD1 = 0;
    if (x[32] >= 30) {
      scoreCQD1 = modelCQD3[0];
      let idx = 1;
      for (let i = 0; i < 46; i++) scoreCQD1 += modelCQD3[idx++] * x[i];
      for (let i = 0; i < 46; i++) {
        for (let j = i; j < 46; j++) {
          if ((i === 26 && (j === 37 || j === 45)) ||
              (i === 42 && j === 44) || (i === 44 && j === 44)) continue;
          scoreCQD1 += modelCQD3[idx++] * (x[i] * x[j]);
        }
      }
    }
    const scoreCQD = (scoreCQD1 > scoreCQD2 ? scoreCQD1 : scoreCQD2) * 100;

    // 10. 四池判定
    const qpP  = (scoreQP + 0.5) | 0;
    const qdP  = (scoreQD + 0.5) | 0;
    const ppP  = (scorePP + 0.5) | 0;
    const cqdP = (scoreCQD + 0.5) | 0;
    const passQP  = qpP  >= th_sqp;
    const passQD  = qdP  >= th_sqd;
    const passPP  = ppP  >= th_spp;
    const passCQD = cqdP >= th_scqd;

    if (passQP || passQD || passPP || passCQD) {
      results.push({
        n, e8,
        qp: qpP, qd: qdP, pp: ppP, cqd: cqdP,
        pq: passQP?1:0, pd: passQD?1:0, pp_: passPP?1:0, pc: passCQD?1:0
      });
    }
  }

  self.postMessage({ type: 'done', results, processed, start, end });
};
`;

const workerUrl = URL.createObjectURL(new Blob([WORKER_CODE], { type: 'application/javascript' }));

// ============================================================
// 动态 Work-Stealing 并行池
// ============================================================
class ParallelPool {
  constructor(numWorkers) {
    this.numWorkers = numWorkers;
    this.workers = [];
    this.nextStart = 0;
    this.end = 0;
    this.BLOCK = 20000;
    this.processed = 0;
    this.total = 0;
    this.results = [];
    this.onProgress = null;
    this.onDone = null;
    this.running = false;
    this.pendingStop = 0;
    this.th_e8 = 0;
    this.th_sqp = 0;
    this.th_sqd = 0;
    this.th_spp = 0;
    this.th_scqd = 0;
  }

  async init(models, prefix, team) {
    for (let i = 0; i < this.numWorkers; i++) {
      this.workers.push(new Worker(workerUrl));
    }

    await Promise.all(this.workers.map(w => new Promise((resolve, reject) => {
      w.onmessage = (e) => {
        if (e.data.type === 'inited') {
          w.postMessage({ type: 'initContext', prefix, team });
        } else if (e.data.type === 'ctxReady') {
          resolve();
        }
      };
      w.onerror = (err) => reject(err);
      w.postMessage({
        type: 'init',
        qp0: models.qp0,
        qd0: models.qd0,
        pp0: models.pp0,
        cqd0: models.cqd0,
        cqd3: models.cqd3
      });
    })));
  }

  startRun(start, end, th, onProgress, onDone) {
    this.nextStart = start;
    this.end = end;
    this.processed = 0;
    this.total = end - start + 1;
    this.results = [];
    this.onProgress = onProgress;
    this.onDone = onDone;
    this.running = true;
    this.pendingStop = 0;
    this.th_e8 = th.e8;
    this.th_sqp = th.sqp;
    this.th_sqd = th.sqd;
    this.th_spp = th.spp;
    this.th_scqd = th.scqd;

    for (let i = 0; i < this.numWorkers; i++) {
      this.workers[i].onmessage = (e) => this.handleMsg(i, e.data);
      this.workers[i].onerror = (err) => {
        console.error('Worker error:', err);
        this.dispatch(i);
      };
      this.dispatch(i);
    }
  }

  dispatch(i) {
    if (this.nextStart > this.end) {
      this.workers[i].postMessage({ type: 'stop' });
      return;
    }
    const ws = this.nextStart;
    const remaining = this.end - ws + 1;
    let chunk = this.BLOCK;
    if (remaining < this.BLOCK * this.numWorkers * 2) {
      chunk = Math.max(500, Math.floor(remaining / this.numWorkers));
    }
    const we = Math.min(ws + chunk - 1, this.end);
    this.nextStart = we + 1;

    this.workers[i].postMessage({
      type: 'work',
      start: ws, end: we,
      th_e8: this.th_e8,
      th_sqp: this.th_sqp, th_sqd: this.th_sqd,
      th_spp: this.th_spp, th_scqd: this.th_scqd
    });
  }

  handleMsg(i, d) {
    if (d.type === 'done') {
      this.processed += d.processed;
      for (const r of d.results) this.results.push(r);
      if (this.onProgress) this.onProgress(this.processed, this.total, this.results.length);
      if (this.nextStart <= this.end) this.dispatch(i);
    } else if (d.type === 'stopped') {
      this.pendingStop++;
      if (this.pendingStop === this.numWorkers) {
        this.running = false;
        if (this.onDone) this.onDone(this.results, this.processed, false);
      }
    }
  }

  stop() {
    if (!this.running) return;
    this.nextStart = this.end + 1;
  }

  terminate() {
    for (const w of this.workers) w.terminate();
    this.workers = [];
    this.running = false;
  }
}

// ============================================================
// UI
// ============================================================
let currentPool = null;
let modelData = null;
let runStartTime = 0;
let speedSampleTime = 0;
let speedSampleProcessed = 0;
let instantSpeed = 0;

function copyText(id) {
  const el = $(id);
  if (!el.value) return alert('暂无内容');
  const t = document.createElement('textarea');
  t.value = el.value; t.style.position = 'absolute'; t.style.left = '-9999px';
  document.body.appendChild(t);
  t.select(); t.setSelectionRange(0, 999999);
  try { document.execCommand('copy'); alert('已复制'); } catch(e) { alert('复制失败'); }
  document.body.removeChild(t);
}

async function loadModels() {
  const files = ['qp0', 'qd0', 'pp0', 'cqd0', 'cqd3'];
  const results = {};
  let done = 0;
  for (const name of files) {
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), 15000);
    try {
      const res = await fetch('https://hywzcyh.github.io/NrD/' + name, { signal: controller.signal });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const text = await res.text();
      let arr;
      if (text.startsWith('[')) {
        try { arr = JSON.parse(text); } catch (e) { arr = new Function('return ' + text)(); }
      } else {
        const m = text.match(/\[[\s\S]*\]/);
        if (m) arr = new Function('return ' + m[0])();
      }
      if (!arr || !arr.length) throw new Error('解析失败');
      results[name] = new Float64Array(arr);
      done++;
      $('modelState').textContent = '加载中 ' + done + '/' + files.length;
    } finally {
      clearTimeout(timeoutId);
    }
  }
  modelData = results;
  $('modelState').innerHTML = '<span class="ok">✅ 已加载</span>';
  $('runBtn').disabled = false;
}

async function startEval() {
  if (!modelData) return alert('模型未加载完成');
  if (currentPool && currentPool.running) return;

  const prefix = $('prefix').value;
  const team = $('team').value.trim();
  const unit = parseInt($('unit').value);
  const start = Math.round(parseFloat($('start').value) * unit);
  const end = Math.round(parseFloat($('end').value) * unit);
  const hc = navigator.hardwareConcurrency || 8;
  const threads = Math.min(parseInt($('threads').value) || hc, 64);
  const BLOCK = Math.max(500, parseInt($('block').value) || 20000);

  const th = {
    e8: parseFloat($('th_e8').value) || 0,
    sqp: parseFloat($('th_sqp').value) || 0,
    sqd: parseFloat($('th_sqd').value) || 0,
    spp: parseFloat($('th_spp').value) || 0,
    scqd: parseFloat($('th_scqd').value) || 0,
  };

  if (start > end) return alert('起始值不能大于结束值');

  if (currentPool) { currentPool.terminate(); currentPool = null; }

  $('runBtn').disabled = true;
  $('stopBtn').disabled = false;
  $('stopBtn').style.display = 'inline-block';
  $('bar').style.width = '0%';
  $('outQP').value = ''; $('outQD').value = '';
  $('outSPP').value = ''; $('outSCQD').value = '';
  $('status').innerHTML = '初始化 worker 池 (' + threads + ' 线程)...';

  const pool = new ParallelPool(threads);
  currentPool = pool;
  pool.BLOCK = BLOCK;

  try {
    await pool.init(modelData, prefix, team);
  } catch (e) {
    $('status').innerHTML = '<span class="bad">❌ 初始化失败: ' + e.message + '</span>';
    pool.terminate();
    currentPool = null;
    $('runBtn').disabled = false;
    $('stopBtn').style.display = 'none';
    return;
  }

  $('status').innerHTML = '运行中...';
  runStartTime = performance.now();
  speedSampleTime = runStartTime;
  speedSampleProcessed = 0;
  instantSpeed = 0;
  let lastRender = 0;

  pool.startRun(start, end, th,
    (processed, total, hits) => {
      const now = performance.now();
      if (now - lastRender > 100) {
        lastRender = now;
        if (now - speedSampleTime > 500) {
          const dt = (now - speedSampleTime) / 1000;
          if (dt > 0) instantSpeed = (processed - speedSampleProcessed) / dt;
          speedSampleTime = now;
          speedSampleProcessed = processed;
        }
        const pct = Math.min(100, processed / total * 100).toFixed(1);
        const elapsed = (now - runStartTime) / 1000;
        const avg = elapsed > 0 ? processed / elapsed : 0;
        const eta = instantSpeed > 0.5 ? (total - processed) / instantSpeed : 0;
        $('bar').style.width = pct + '%';
        $('status').innerHTML =
          '进度 <b>' + pct + '%</b> (' + processed + ' / ' + total + ')' +
          ' | 命中 <b>' + hits + '</b>' +
          ' | 已用 <b>' + elapsed.toFixed(1) + 's</b>' +
          ' | 实时 <b>' + instantSpeed.toFixed(0) + '/s</b>' +
          ' | 平均 <b>' + avg.toFixed(0) + '/s</b>' +
          ' | 剩余 <b>' + eta.toFixed(1) + 's</b>';
      }
    },
    (results, processed, wasStopped) => {
      const qpList = [], qdList = [], ppList = [], cqdList = [];
      for (const r of results) {
        const name = prefix + r.n + '@' + team;
        if (r.pq)  qpList.push({  v: r.qp,  s: name + ' | 八围:' + r.e8.toFixed(2) + ' | SQP:'  + r.qp  });
        if (r.pd)  qdList.push({  v: r.qd,  s: name + ' | 八围:' + r.e8.toFixed(2) + ' | SQD:'  + r.qd  });
        if (r.pp_) ppList.push({  v: r.pp,  s: name + ' | 八围:' + r.e8.toFixed(2) + ' | SPP:'  + r.pp  });
        if (r.pc)  cqdList.push({ v: r.cqd, s: name + ' | 八围:' + r.e8.toFixed(2) + ' | SCQD:' + r.cqd });
      }
      qpList.sort((a,b) => b.v - a.v);
      qdList.sort((a,b) => b.v - a.v);
      ppList.sort((a,b) => b.v - a.v);
      cqdList.sort((a,b) => b.v - a.v);

      $('outQP').value   = qpList.map(x => x.s).join('\n');
      $('outQD').value   = qdList.map(x => x.s).join('\n');
      $('outSPP').value  = ppList.map(x => x.s).join('\n');
      $('outSCQD').value = cqdList.map(x => x.s).join('\n');

      const elapsed = (performance.now() - runStartTime) / 1000;
      const avg = elapsed > 0 ? processed / elapsed : 0;
      $('bar').style.width = '100%';
      $('status').innerHTML =
        (wasStopped ? '⏸ 已停止' : '✅ 完成') +
        ' | 处理 <b>' + processed + '</b> 号' +
        ' | QP <b>' + qpList.length + '</b>' +
        ' | QD <b>' + qdList.length + '</b>' +
        ' | SPP <b>' + ppList.length + '</b>' +
        ' | SCQD <b>' + cqdList.length + '</b>' +
        ' | 总用时 <b>' + elapsed.toFixed(2) + 's</b>' +
        ' | 平均 <b>' + avg.toFixed(0) + '/s</b>';
      $('runBtn').disabled = false;
      $('stopBtn').style.display = 'none';
    }
  );
}

function stopEval() {
  if (currentPool && currentPool.running) {
    currentPool.stop();
    $('stopBtn').disabled = true;
  }
}

window.addEventListener('load', () => {
  $('runBtn').addEventListener('click', startEval);
  $('stopBtn').addEventListener('click', stopEval);
  loadModels().catch(e => {
    $('modelState').innerHTML = '<span class="bad">❌ 加载失败: ' + e.message + '</span>';
  });
});
</script>
